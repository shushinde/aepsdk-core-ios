#
# Pilot-only, one-off workflow: regenerates the committed API/*.json baseline files
# (swift api-digester dumps) under the runner's current Xcode toolchain, then commits
# and pushes the result to the branch that was checked out. Used to refresh baselines
# that were generated under an older Xcode (16) so `make api-check` stops reporting
# toolchain-only diffs (e.g. the new SendableMetatype conformance) as breaking changes.
#

name: (Pilot) Regenerate API baseline

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to check out, regenerate on, and push back to.'
        type: string
        required: true
        default: 'main'
      xcode-version:
        description: 'Xcode version to use for the regeneration.'
        type: string
        required: true
        default: '26.0'

jobs:
  regenerate:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Regenerate API baseline
        run: |
          set -eo pipefail
          make api-dump

      - name: Show diff
        run: |
          git diff --stat -- API/ || true

      - name: Commit and push
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- API/; then
            echo "No changes to API/*.json, skipping commit."
            exit 0
          fi

          git add API/
          git commit -m "chore: regenerate API baseline under Xcode ${{ inputs.xcode-version }}"
          git push origin HEAD:"${REF}"
